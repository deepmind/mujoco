# This configuration is used to build and test on GitHub Actions only.
# It is not the same configuration that is used by Google DeepMind to create release binaries.
# The "official" binaries are built with Clang 13 on all platforms, and are linked against libc++
# on Linux.
#
# We set CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF here to reduce build time.
# It is highly recommended that this is set to ON for production builds.
#
# Build speed notes:
#   * The compiler matrix lives in build_matrix.json. Pull requests build the
#     representative "core" subset; pushes to main run the full compiler sweep.
#     (See generate_matrix() in build_steps.sh.)
#   * Studio/Filament is built in the core matrix jobs (after Build MuJoCo Core
#     and before Build MuJoCo Tests). WASM is NOT built in the main matrix - it
#     is covered by the dedicated `wasm` job below because it is built with
#     emcc, which ignores the host compiler, so building it per-compiler added
#     no coverage.
#   * ccache is used to wrap the compiler. PR branches fall back to main's cache, so
#     the expensive (and pinned) Filament build is restored rather than recompiled.

# TODO(matijak): Consider switching Windows to Ninja builds only, this configures slightly faster
# and brings Windows in line with other OSes. Also we wouldn't need to specify the --config option
# in the build step because Ninja doesn't support multiple configurations (unlike MSBuild).

name: build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "doc/**"
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "doc/**"
      - "**/README.md"

# Limit the default GITHUB_TOKEN to read-only. No job here writes via the token:
# checkout reads the repo; ccache/cache and upload-artifact use their own backend
# tokens; the chat notification uses a secret webhook.
permissions:
  contents: read

jobs:
  # Compute the build matrix based on the event: PRs get the "core" representative
  # compiler set, pushes to main get the full sweep.
  setup:
    name: "setup (compute matrix)"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      bazel_matrix: ${{ steps.generate.outputs.bazel_matrix }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Generate build matrix
      id: generate
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: bash ./.github/workflows/build_steps.sh generate_matrix

  mujoco:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Prepare Windows (setup MSVC)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -products * -latest -prerelease -property installationPath
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $lines = cmd.exe /c "`"$vcvars`" x64 >nul && set"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        foreach ($line in $lines) {
          $idx = $line.IndexOf("=")
          if ($idx -gt 0) {
            $name = $line.Substring(0, $idx)
            $val = $line.Substring($idx + 1)
            if ($before[$name] -ne $val) {
              "$name=$val" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
        }

    - name: Prepare Linux
      if: ${{ runner.os == 'Linux' }}
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - name: Prepare macOS
      if: ${{ runner.os == 'macOS' }}
      run: brew install ninja

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        # Shared with the Bazel build (MODULE.bazel python.defaults).
        python-version-file: .github/workflows/python-version

    # Cache the uv binary and wheel cache on POSIX so prepare_python can install
    # both uv and build_requirements*.txt offline on cache hits without fetching
    # from GitHub or PyPI. Windows stays on pip (it is not a Python-setup
    # bottleneck, and this keeps the venv activate fixup path untouched there).
    - name: Cache Python dependencies
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/uv_cache
        key: uv-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/python-version', '.github/workflows/uv_requirements.txt', 'python/build_requirements*.txt') }}
        restore-keys: |
          uv-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Prepare Python
      shell: bash
      env:
        TMPDIR: ${{ matrix.tmpdir }}
        UV_CACHE_DIR: ${{ runner.temp }}/uv_cache
      run: bash ./.github/workflows/build_steps.sh prepare_python

    # ccache dramatically speeds up warm rebuilds. The key is the matrix label so
    # each compiler gets its own cache; the action's restore-keys let PR branches
    # fall back to main's cache. MSVC is skipped because it is finicky with /Zi,
    # but Windows with Clang uses ccache via Ninja.
    - name: Setup ccache
      if: ${{ runner.os != 'Windows' || contains(matrix.label, 'clang') }}
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ matrix.label }}-mujoco
        max-size: ${{ contains(matrix.cmake_args, 'MUJOCO_BUILD_STUDIO:BOOL=ON') && '300M' || '150M' }}
        save: ${{ github.ref_name == 'main' }}

    - name: Cache external dependencies
      if: github.ref_name == 'main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-${{ runner.os == 'Windows' && 'windows' || 'posix' }}-${{ contains(matrix.cmake_args, 'MUJOCO_BUILD_STUDIO:BOOL=ON') && 'studio' || 'core' }}-${{ hashFiles('cmake/**', 'python/mujoco/CMakeLists.txt') }}

    - name: Restore external dependencies
      if: github.ref_name != 'main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-${{ runner.os == 'Windows' && 'windows' || 'posix' }}-${{ contains(matrix.cmake_args, 'MUJOCO_BUILD_STUDIO:BOOL=ON') && 'studio' || 'core' }}-${{ hashFiles('cmake/**', 'python/mujoco/CMakeLists.txt') }}

    - name: Configure MuJoCo
      env:
        TMPDIR: ${{ matrix.tmpdir }}
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ matrix.cmake_args }}
      run: bash ./.github/workflows/build_steps.sh configure_mujoco

    - name: Upload CMake Configure Log
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cmake-configure-log-${{ matrix.label }}
        path: build/CMakeFiles/CMakeConfigureLog.yaml
        retention-days: 5

    - name: Build MuJoCo Core
      working-directory: build
      env:
        CMAKE_BUILD_ARGS: ${{ matrix.cmake_build_args }}
      run: bash ../.github/workflows/build_steps.sh build_mujoco_core

    - name: Build MuJoCo Studio
      if: ${{ contains(matrix.cmake_args, 'MUJOCO_BUILD_STUDIO:BOOL=ON') }}
      working-directory: build
      env:
        CMAKE_BUILD_ARGS: ${{ matrix.cmake_build_args }}
      run: bash ../.github/workflows/build_steps.sh build_mujoco_studio

    - name: Build MuJoCo Tests
      working-directory: build
      env:
        CMAKE_BUILD_ARGS: ${{ matrix.cmake_build_args }}
      run: bash ../.github/workflows/build_steps.sh build_mujoco

    - name: Test MuJoCo
      working-directory: build
      run: bash ../.github/workflows/build_steps.sh test_mujoco

    - name: Install MuJoCo
      working-directory: build
      run: bash ../.github/workflows/build_steps.sh install_mujoco

    - name: Copy plugins (POSIX)
      if: ${{ runner.os != 'Windows' }}
      working-directory: build
      env:
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ../.github/workflows/build_steps.sh copy_plugins_posix

    - name: Copy plugins (Windows)
      if: ${{ runner.os == 'Windows' }}
      working-directory: build
      env:
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ../.github/workflows/build_steps.sh copy_plugins_window

    - name: Install MuJoCo Studio platform
      if: ${{ contains(matrix.cmake_args, 'MUJOCO_BUILD_STUDIO:BOOL=ON') }}
      shell: bash
      env:
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ./.github/workflows/build_steps.sh install_studio_platform

    - name: Configure samples
      working-directory: sample
      env:
        TMPDIR: ${{ matrix.tmpdir }}
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ matrix.cmake_args }}
      run: bash ../.github/workflows/build_steps.sh configure_samples

    - name: Build samples
      working-directory: sample/build
      env:
        CMAKE_BUILD_ARGS: ${{ matrix.cmake_build_args }}
      run: bash ../../.github/workflows/build_steps.sh build_samples

    - name: Configure simulate
      working-directory: simulate
      env:
        TMPDIR: ${{ matrix.tmpdir }}
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ matrix.cmake_args }}
      run: bash ../.github/workflows/build_steps.sh configure_simulate

    - name: Build simulate
      working-directory: simulate/build
      env:
        CMAKE_BUILD_ARGS: ${{ matrix.cmake_build_args }}
      run: bash ../../.github/workflows/build_steps.sh build_simulate

    - name: Make Python sdist
      shell: bash
      working-directory: python
      env:
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ../.github/workflows/build_steps.sh make_python_sdist

    - name: Build Python bindings
      if: ${{ runner.os != 'Windows' || contains(matrix.label, 'clang') }}
      shell: bash
      working-directory: python/dist
      env:
        TMPDIR: ${{ matrix.tmpdir }}
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ matrix.cmake_args }}
      run: bash ../../.github/workflows/build_steps.sh build_python_bindings

    - name: Install Python bindings
      if: ${{ runner.os != 'Windows' || contains(matrix.label, 'clang') }}
      shell: bash
      working-directory: python/dist
      env:
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ../../.github/workflows/build_steps.sh install_python_bindings

    - name: Test Python bindings
      if: ${{ runner.os != 'Windows' || contains(matrix.label, 'clang') }}
      shell: bash
      env:
        MUJOCO_GL: disable
        TMPDIR: ${{ matrix.tmpdir }}
      run: bash ./.github/workflows/build_steps.sh test_python_bindings

    # MJX (mujoco.mjx) is covered by the dedicated `mjx` job below; it is
    # compiler-independent so it does not need to run in every matrix job.

    - name: Notify team chat
      if: failure() && github.ref_name == 'main' && github.event_name == 'push'
      uses: ./.github/actions/notify-chat
      with:
        service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
        user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
        space-id: "spaces/AAAAzcCLt1A"


  # This job quickly determines if WASM bindings are broken.
  wasm:
    name: "ubuntu-24.04-clang-18-wasm"
    runs-on: ubuntu-24.04
    env:
      label: "ubuntu-24.04-clang-18-wasm"
      cmake_args: >-
        -G Ninja
        -DCMAKE_C_COMPILER:STRING=clang-18
        -DCMAKE_CXX_COMPILER:STRING=clang++-18
        -DMUJOCO_HARDEN:BOOL=ON
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Setup Node.js for WASM bindings
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.x'

    - name: Prepare Linux
      if: ${{ runner.os == 'Linux' }}
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ env.label }}
        max-size: "250M"
        save: ${{ github.ref_name == 'main' }}

    - name: Setup Emscripten
      run: bash ./.github/workflows/build_steps.sh setup_emsdk

    # Cache Emscripten's compiled sysroot libraries (e.g. multithreaded +
    # exception-enabled libc/libc++/libgl/embind built on demand for Studio
    # WASM). Keyed on the static Emscripten version so it occupies a single ~50MB
    # slot without creating new cache entries per commit.
    - name: Cache Emscripten sysroot
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: emsdk/upstream/emscripten/cache
        key: emsdk-sysroot-4.0.10

    - name: Cache external dependencies
      if: github.ref_name == 'main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-posix-wasm-${{ hashFiles('cmake/**') }}

    - name: Restore external dependencies
      if: github.ref_name != 'main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-posix-wasm-${{ hashFiles('cmake/**') }}

    - name: Build and Test WASM bindings
      env:
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ env.cmake_args }}
      run: |
        bash ./.github/workflows/build_steps.sh npm_ci
        bash ./.github/workflows/build_steps.sh build_test_wasm

    - name: Build MuJoCo Studio WASM
      env:
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
        CMAKE_ARGS: ${{ env.cmake_args }}
      run: bash ./.github/workflows/build_steps.sh build_studio_wasm

    - name: Notify team chat
      if: failure() && github.ref_name == 'main' && github.event_name == 'push'
      uses: ./.github/actions/notify-chat
      with:
        service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
        user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
        space-id: "spaces/AAAAzcCLt1A"


  # MJX (mujoco.mjx) is pure JAX/XLA and compiler-independent: it imports the
  # mujoco Python package only as a reference, so its tests run once here instead
  # of in every matrix job. MuJoCo is built WITHOUT the C++ test suite (MJX does
  # not need it) to keep the build lean.
  mjx:
    name: "ubuntu-24.04-clang-18-mjx"
    runs-on: ubuntu-24.04
    env:
      TMPDIR: "/tmp"
      CMAKE_ARGS: >-
        -G Ninja
        -DCMAKE_C_COMPILER:STRING=clang-18
        -DCMAKE_CXX_COMPILER:STRING=clang++-18
        -DMUJOCO_HARDEN:BOOL=ON
        -DMUJOCO_BUILD_TESTS:BOOL=OFF
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Prepare Linux
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        # Shared with the Bazel build (MODULE.bazel python.defaults).
        python-version-file: .github/workflows/python-version

    - name: Cache Python dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/uv_cache
        key: uv-deps-mjx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/python-version', '.github/workflows/uv_requirements.txt', 'python/build_requirements*.txt', 'mjx/requirements.txt') }}
        restore-keys: |
          uv-deps-mjx-${{ runner.os }}-${{ runner.arch }}-
          uv-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Prepare Python
      env:
        UV_CACHE_DIR: ${{ runner.temp }}/uv_cache
      run: bash ./.github/workflows/build_steps.sh prepare_python

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ubuntu-24.04-clang-18-mjx
        max-size: "100M"
        save: ${{ github.ref_name == 'main' }}

    - name: Cache external dependencies
      if: github.ref_name == 'main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-posix-mjx-${{ hashFiles('cmake/**', 'python/mujoco/CMakeLists.txt') }}

    - name: Restore external dependencies
      if: github.ref_name != 'main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-posix-mjx-${{ hashFiles('cmake/**', 'python/mujoco/CMakeLists.txt') }}

    - name: Configure MuJoCo
      env:
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
      run: bash ./.github/workflows/build_steps.sh configure_mujoco

    - name: Build MuJoCo
      working-directory: build
      run: bash ../.github/workflows/build_steps.sh build_mujoco

    - name: Install MuJoCo
      working-directory: build
      run: bash ../.github/workflows/build_steps.sh install_mujoco

    - name: Copy plugins
      working-directory: build
      run: bash ../.github/workflows/build_steps.sh copy_plugins_posix

    - name: Make Python sdist
      working-directory: python
      run: bash ../.github/workflows/build_steps.sh make_python_sdist

    - name: Build Python bindings
      working-directory: python/dist
      env:
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
      run: bash ../../.github/workflows/build_steps.sh build_python_bindings

    - name: Install Python bindings
      working-directory: python/dist
      run: bash ../../.github/workflows/build_steps.sh install_python_bindings

    - name: Package MJX
      working-directory: mjx
      run: bash ../.github/workflows/build_steps.sh package_mjx

    - name: Install MJX
      working-directory: mjx
      env:
        UV_CACHE_DIR: ${{ runner.temp }}/uv_cache
      run: bash ../.github/workflows/build_steps.sh install_mjx

    - name: Test MJX
      working-directory: mjx
      run: bash ../.github/workflows/build_steps.sh test_mjx

    - name: Notify team chat
      if: failure() && github.ref_name == 'main' && github.event_name == 'push'
      uses: ./.github/actions/notify-chat
      with:
        service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
        user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
        space-id: "spaces/AAAAzcCLt1A"


  bazel:
    needs: setup
    strategy:
      fail-fast: false
      # bazel_version is passed to bazelisk as USE_BAZEL_VERSION. Empty means
      # the version pinned in .bazelversion. PRs test only the pinned version.
      # Pushes (postsubmits) also test 8.x, the oldest LTS allowed by
      # bazel_compatibility in MODULE.bazel, and latest, which catches breakage
      # from new Bazel releases early. See build_matrix.json.
      matrix: ${{ fromJson(needs.setup.outputs.bazel_matrix) }}
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    # A new upstream Bazel release can break the "latest" job without any
    # MuJoCo change, so report it without failing the workflow.
    continue-on-error: ${{ matrix.bazel_version == 'latest' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Prepare Linux
      if: ${{ runner.os == 'Linux' }}
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
        # Bazel 9 keeps unpacked external repos (the repo contents cache) inside
        # the repository cache, which roughly doubles what is saved to the
        # GitHub cache. Re-extracting them from the cached archives only takes
        # seconds, so turn it off here. It is already off by default in Bazel 8.
        bazelrc: common --repo_contents_cache=

    # Bazel disk cache, only for jobs with disk_cache in build_matrix.json. Like
    # ccache above, each push to main saves a new entry and every run restores
    # the newest one. (setup-bazel's disk-cache only saves when the BUILD files
    # change, so it goes stale.)
    - name: Restore Bazel disk cache
      if: ${{ matrix.disk_cache }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ matrix.label }}-${{ github.sha }}
        restore-keys: bazel-disk-${{ matrix.label }}-

    - name: Enable Bazel disk cache
      if: ${{ matrix.disk_cache }}
      run: |
        mkdir -p ~/.cache/bazel-disk
        # setup-bazel writes ~/.bazelrc without a trailing newline.
        printf '\nbuild --disk_cache=%s/.cache/bazel-disk\n' "${HOME}" >> ~/.bazelrc
        # Bazel refreshes the mtime of every disk cache entry it uses, so
        # entries older than this marker after the build were not used.
        touch "${RUNNER_TEMP}/bazel-disk-cache-start"

    - name: Build and Test with Bazel
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
      run: bash ./.github/workflows/build_steps.sh test_bazel

    # Drop the entries this build didn't use before saving, so the cache only
    # holds the current build's outputs instead of growing (and growing more
    # stale) with every push.
    - name: Prune Bazel disk cache
      if: ${{ matrix.disk_cache && github.event_name == 'push' && github.ref_name == 'main' }}
      run: find ~/.cache/bazel-disk -type f ! -newer "${RUNNER_TEMP}/bazel-disk-cache-start" -delete

    - name: Save Bazel disk cache
      if: ${{ matrix.disk_cache && github.event_name == 'push' && github.ref_name == 'main' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ matrix.label }}-${{ github.sha }}

    - name: Notify team chat
      if: failure() && github.ref_name == 'main' && github.event_name == 'push'
      uses: ./.github/actions/notify-chat
      with:
        service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
        user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
        space-id: "spaces/AAAAzcCLt1A"
