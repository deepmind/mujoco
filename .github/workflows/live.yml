name: live

on:
  push:
    branches:
      - live
  # zizmor: ignore[dangerous-triggers] - triggers on completion of update-live to build live branch
  workflow_run:
    workflows: ["update-live"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-and-upload-artifacts:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: live
        persist-credentials: false

    - name: Prepare Linux
      run: bash ./.github/workflows/build_steps.sh prepare_linux

    - name: Setup Emscripten
      run: bash ./.github/workflows/build_steps.sh setup_emsdk

    - name: Cache external dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/external_deps
        key: external-deps-v2-posix-live-${{ hashFiles('cmake/**') }}

    - name: Build MuJoCo Live
      env:
        CC: clang-18
        CXX: clang++-18
        EXTERNAL_DEPS_DIR: ${{ runner.temp }}/external_deps
      run: bash ./.github/workflows/build_steps.sh build_mujoco_live

    - name: Prepare files for GitHub Pages
      run: |
        mkdir -p dist/bin/ios
        cp -r build_wasm/bin/* dist/bin/
        cp -r build_wasm_ios/bin/* dist/bin/ios/
        cp studio/live.html dist/index.html
        cp studio/live.css dist/live.css
        cp studio/live.js dist/live.js
        cp studio/favicon.ico dist/favicon.ico
        COMMIT_HASH=$(git rev-parse HEAD 2>/dev/null || true)
        if [ -n "$COMMIT_HASH" ]; then
          sed -i "s/__COMMIT_HASH_PLACEHOLDER__/$COMMIT_HASH/g" dist/index.html
        fi

    - name: Upload GitHub Pages artifacts
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: dist

  deploy-pages:
    permissions:
      pages: write
      id-token: write
    needs: build-and-upload-artifacts
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
